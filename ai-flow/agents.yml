# Orchestrator configuration for ai-flow/run_tasks.py

default_agent: claude          # which agent to use by default
task_timeout: 1200             # per-task timeout, seconds
completion_marker: "<promise>COMPLETE</promise>"

# Unit of work — the green-tests gate and the docs apply to the unit of work that was requested:
#   feature → in a feature run (no --task) every task writes its tests (TDD) and must compile, and
#             records what it built only in <feature>/NOTES.md. Tests and docs happen ONCE per
#             feature: after its last task a verification pass (PROMT_VERIFY.md) runs the whole
#             suite, fixes failures, then writes the changelog / spec / as-built / memories from the
#             notes; only a green pass archives the feature. A --task run is a single-task unit and
#             runs its own tests and docs.
#   task    → every task builds, runs the tests and updates the docs (no verification pass).
unit_of_work: feature          # legacy name: test_gate
verify_timeout: 2400           # verification pass timeout, seconds (default: 2 × task_timeout)

git:
  enabled: true                # false → no commits; also auto-skipped if not a git repo
  auto_commit: true
  message_template: "feat: task #{id} - {title}"   # truncated to <=155 chars, no tool mentions
  verify_message_template: "test: feature #{feature} - tests green"   # the verification pass commit

# Explicit parallel batches — opt-in per task: only ready tasks of ONE feature that name each other in
# `Parallel with:` (mutually and completely) run together, each in an isolated git worktree; one
# integration pass then merges them atomically. Needs git auto-commit and a clean worktree. Without
# such declarations every task runs sequentially; `--task` runs are always sequential.
parallel:
  enabled: true
  max_workers: 2               # the largest allowed group; override with --max-parallel (0/1 = off)

context:                       # all paths are relative to REPO_ROOT (the parent of ai-flow/)
  rules_file: CLAUDE.md                             # the project rules file embedded into prompts
  tasks_dir: ai-flow/docs/tasks                     # feature folders with task files + done/
  specs_dir: ai-flow/docs/specs                     # project + per-feature specs (target + as-built)
  memories_dir: .serena/memories                    # Serena memory in the repo root (raw .md)
  changelog_file: ai-flow/docs/CHANGELOG.md
  agent_prompt: ai-flow/docs/prompts/PROMT_AGENT.md
  verify_prompt: ai-flow/docs/prompts/PROMT_VERIFY.md    # the feature verification pass
  inline_memories: false                            # false → inject memory pointers, not full text
  changelog_entries: 3                              # last N changelog entries sent to a task (0 → none)

agents:
  # Claude Code — https://docs.claude.com/claude-code — the only agent this template ships with.
  claude:
    command: "claude --model {model} --print --dangerously-skip-permissions"
    model: sonnet
    loads_claude_md: true      # the CLI auto-loads CLAUDE.md → the orchestrator does not embed it again

  # Using a different agentic CLI? Do not guess its flags here — run
  # ai-flow/docs/prompts/PROMT_TOOL.md under that tool: it verifies the CLI's real headless
  # interface and adds the entry itself. The shape it must produce:
  #
  # <name>:
  #   command: "<cli> ... {model} ..."   # prompt arrives on stdin;
  #                                      # use the {prompt_file} placeholder instead when the CLI
  #                                      # cannot read stdin (run_tasks.py substitutes a temp file)
  #   model: <default model>
  #   loads_claude_md: true              # ONLY if the CLI itself loads CLAUDE.md (verified) — then the
  #                                      # orchestrator stops embedding it; omit it otherwise
  #   env:                               # optional; ${VARS} are expanded from the environment
  #     SOME_API_KEY: "${SOME_API_KEY}"
